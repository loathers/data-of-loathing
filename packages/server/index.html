<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data of Loathing</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, monospace;
        font-size: 13px;
        background: #0d1117;
        color: #e6edf3;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        flex-shrink: 0;
      }

      header h1 { font-size: 14px; letter-spacing: 0.1em; color: #58a6ff; }
      header .meta { color: #8b949e; font-size: 12px; }
      #status { color: #f0883e; font-size: 12px; }

      .layout {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      aside {
        width: 200px;
        flex-shrink: 0;
        background: #161b22;
        border-right: 1px solid #30363d;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      aside h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8b949e;
        padding: 10px 12px 6px;
        border-bottom: 1px solid #21262d;
      }

      #table-list {
        overflow-y: auto;
        flex: 1;
      }

      .table-btn {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: #e6edf3;
        padding: 6px 12px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .table-btn:hover { background: #21262d; }
      .table-btn.active { background: #1f3a5f; color: #58a6ff; }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .table-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-bottom: 1px solid #30363d;
      }

      .table-title {
        padding: 8px 14px;
        font-size: 12px;
        color: #8b949e;
        border-bottom: 1px solid #21262d;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #table-name { color: #e6edf3; }

      #pagination {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #8b949e;
      }

      #pagination button {
        background: #21262d;
        border: 1px solid #30363d;
        color: #e6edf3;
        padding: 2px 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        border-radius: 3px;
      }

      #pagination button:hover:not(:disabled) { background: #30363d; }
      #pagination button:disabled { opacity: 0.4; cursor: default; }

      .table-scroll {
        overflow: auto;
        flex: 1;
      }

      table {
        border-collapse: collapse;
        width: max-content;
        min-width: 100%;
      }

      th {
        background: #161b22;
        color: #8b949e;
        font-weight: 600;
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #30363d;
        border-right: 1px solid #21262d;
        position: sticky;
        top: 0;
        white-space: nowrap;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      td {
        padding: 4px 12px;
        border-bottom: 1px solid #21262d;
        border-right: 1px solid #161b22;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: top;
      }

      tr:hover td { background: #161b22; }

      .query-view {
        flex-shrink: 0;
        padding: 10px 14px;
        background: #0d1117;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 280px;
      }

      .query-view h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8b949e;
      }

      .query-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      #sql-input {
        flex: 1;
        background: #161b22;
        border: 1px solid #30363d;
        color: #e6edf3;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 10px;
        resize: vertical;
        min-height: 52px;
        border-radius: 4px;
        outline: none;
      }

      #sql-input:focus { border-color: #58a6ff; }

      #sql-run {
        background: #238636;
        border: 1px solid #2ea043;
        color: #fff;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 14px;
        cursor: pointer;
        border-radius: 4px;
        white-space: nowrap;
        align-self: flex-start;
      }

      #sql-run:hover { background: #2ea043; }

      #sql-result {
        overflow: auto;
        max-height: 120px;
        font-size: 12px;
      }

      #sql-result table { min-width: unset; }
      #sql-result th, #sql-result td { font-size: 11px; padding: 3px 8px; }

      .error { color: #f85149; }
      .muted { color: #8b949e; }
    </style>
  </head>
  <body>
    <header>
      <h1>DATA OF LOATHING</h1>
      <span class="meta" id="last-updated"></span>
      <span id="status">Loading…</span>
    </header>
    <div class="layout">
      <aside>
        <h2>Tables</h2>
        <div id="table-list"></div>
      </aside>
      <main>
        <div class="table-view">
          <div class="table-title">
            <span id="table-name"></span>
            <div id="pagination"></div>
          </div>
          <div class="table-scroll">
            <table>
              <thead id="table-header"></thead>
              <tbody id="table-body"><tr><td class="muted" style="padding:20px">Select a table</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="query-view">
          <h3>SQL Query</h3>
          <div class="query-row">
            <textarea id="sql-input" placeholder="SELECT …"></textarea>
            <button id="sql-run">Run</button>
          </div>
          <div id="sql-result"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/browser/main.ts"></script>
  </body>
</html>
