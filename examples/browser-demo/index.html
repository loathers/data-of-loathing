<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data of Loathing — Browser Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
      header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 16px; }
      header h1 { font-size: 1rem; color: #e94560; letter-spacing: 2px; }
      #status { font-size: 0.75rem; color: #888; }
      main { padding: 24px; max-width: 800px; display: flex; flex-direction: column; gap: 16px; }
      .search-row { display: flex; gap: 8px; }
      input { flex: 1; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; padding: 8px 12px; font-family: monospace; font-size: 0.9rem; outline: none; }
      input:focus { border-color: #e94560; }
      button { background: #e94560; border: none; color: white; padding: 8px 16px; font-family: monospace; font-size: 0.9rem; cursor: pointer; }
      button:hover { background: #c73652; }
      button:disabled { background: #444; cursor: default; }
      .result { background: #16213e; border: 1px solid #0f3460; padding: 16px; font-size: 0.8rem; white-space: pre-wrap; line-height: 1.6; min-height: 80px; }
      .result .label { color: #888; }
      .result .value { color: #4ade80; }
      .result .name  { color: #e94560; font-size: 1rem; }
      .result .error { color: #f87171; }
      .timing { font-size: 0.7rem; color: #888; text-align: right; }
    </style>
  </head>
  <body>
    <header>
      <h1>DATA OF LOATHING</h1>
      <span id="status">Connecting…</span>
    </header>
    <main>
      <p style="font-size:0.75rem;color:#888">
        Cache strategy — downloads the database once and stores it in OPFS. Subsequent loads skip the download if unchanged.
      </p>
      <div class="search-row">
        <input id="query" type="text" placeholder="item name…" value="seal tooth" />
        <button id="search" disabled>Search</button>
      </div>
      <div class="result" id="result"><span class="label">waiting for connection…</span></div>
      <div class="timing" id="timing"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
